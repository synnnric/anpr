# nginx server block for the ANPR + S300 platform — SINGLE DOMAIN.
# Replaces the Apache .htaccess routing (nginx ignores .htaccess entirely).
#
# One domain, no sub-domains:
#   SPA       ->  https://anprc-sigap.dpr.go.id/
#   Backend   ->  https://anprc-sigap.dpr.go.id/anpr_backend/...   (PHP-FPM)
#   Uploads   ->  https://anprc-sigap.dpr.go.id/anpr_backend/uploads/...
#
# The backend derives its route from REQUEST_URI and strips the /anpr_backend
# prefix itself (Request.php), so nginx only has to (a) keep REQUEST_URI intact
# and (b) run public/index.php. No PATH_INFO handling needed.
#
# BEFORE USING, set the CHECK_ME values:
#   1. fastcgi_pass    — AlmaLinux php-fpm default: unix:/run/php-fpm/www.sock
#   2. the two roots   — SPA docroot + backend folder
#   3. server_name     — the real domain

server {
    listen 80;
    server_name anprc-sigap.dpr.go.id;              # CHECK_ME

    root /var/www/anprc-sigap.dpr.go.id;            # CHECK_ME — SPA docroot (frontend/dist)
    index index.html;

    client_max_body_size 50m;                       # matches backend upload max (50 MB)

    # --- Uploaded media: served straight off disk (highest priority) ---
    # ^~ so this prefix wins over the PHP location below; alias maps the URL
    # path to the on-disk uploads folder. NOTE the backend lives INSIDE the
    # docroot at <docroot>/anpr_backend (confirmed prod layout 2026-07-24).
    location ^~ /anpr_backend/uploads/ {
        alias /var/www/anprc-sigap.dpr.go.id/anpr_backend/uploads/;   # CHECK_ME (trailing slash)
        access_log off;
        expires 7d;
        try_files $uri =404;
    }

    # --- Backend API: everything else under /anpr_backend -> front controller ---
    # ^~ takes priority over the SPA "location /". REQUEST_URI stays the full
    # "/anpr_backend/api/..." which the PHP Router strips; we just run index.php.
    location ^~ /anpr_backend/ {
        fastcgi_pass unix:/run/php-fpm/www.sock;    # CHECK_ME — socket or 127.0.0.1:9000
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/anprc-sigap.dpr.go.id/anpr_backend/public/index.php;   # CHECK_ME
        fastcgi_param SCRIPT_NAME /anpr_backend/public/index.php;
        # public/index.php reads $_SERVER['APP_ENV'] to load config.prod.php.
        fastcgi_param APP_ENV prod;
        # nginx drops the bearer token from fastcgi by default -> every
        # authenticated endpoint would 401 without this line.
        fastcgi_param HTTP_AUTHORIZATION $http_authorization;
        # (REQUEST_URI is already set to $request_uri by fastcgi_params.)
    }

    # --- SPA (built frontend/dist) at the domain root ---
    location / {
        try_files $uri $uri/ /index.html;
    }
}

# ─────────────────────────────────────────────────────────────────────────────
# HTTPS + MQTT-over-WebSocket on the SAME domain (no wss- sub-domain needed).
#
# When you add TLS, put everything in a `listen 443 ssl;` copy of the block
# above and add this location so operators' browsers reach the broker at
# wss://anprc-sigap.dpr.go.id/mqtt (no mixed-content, one cert, one domain):
#
#   location /mqtt {
#       proxy_pass http://10.10.33.143:8083;    # CHECK_ME — Mosquitto's WS listener port
#       proxy_http_version 1.1;
#       proxy_set_header Upgrade $http_upgrade;
#       proxy_set_header Connection "upgrade";
#       proxy_read_timeout 3600s;               # keep the long-lived WS open
#   }
#
# Then in the dashboard's Koneksi MQTT panel the operator sets:
#   Host = anprc-sigap.dpr.go.id   Port = 443   SSL = on   (URL = wss://…/mqtt)
# 8083 is Mosquitto's WebSocket listener; 8171 is the RAW-MQTT port (worker
# only) and must NOT be used here — browsers can't speak raw MQTT.
# ─────────────────────────────────────────────────────────────────────────────
